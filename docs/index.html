<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miss Party">
<meta name="theme-color" content="#E5DECE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<title>Miss Party</title>
<style>
:root {
  /* Palette */
  --lace: #E8E1D1;      /* Antique Lace */
  --peach: #D8B69F;     /* Soft Peach */
  --blush: #C38380;     /* Rosy Blush */
  --taupe: #9C7164;     /* Rose Taupe */
  --umber: #4B342C;     /* Deep Umber */
  --red: #C8413B;       /* pastille de notification */

  --bg: #E5DECE;        /* fond du logo, pour qu'il se fonde dans la page */
  --surface: #EFEAE0;
  --surface-2: #F5F1EA;
  --line: rgba(75, 52, 44, .14);
  --line-strong: rgba(75, 52, 44, .28);
  --text: var(--umber);
  --muted: rgba(75, 52, 44, .62);
  --faint: rgba(75, 52, 44, .38);

  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans: "Jost", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font: 300 15px/1.5 var(--sans);
  color: var(--text);
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: lining-nums;
}
.serif, .italic, .big, .num, .code, .val, .scores button { font-variant-numeric: lining-nums tabular-nums; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select { font: inherit; font-size: 16px; color: var(--text); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }
.serif { font-family: var(--serif); font-weight: 400; }
.italic { font-family: var(--serif); font-style: italic; font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.tiny { font-size: 10.5px; }
.center { text-align: center; }
.eyebrow { font-family: var(--sans); font-size: 10.5px; font-weight: 300; letter-spacing: .22em; text-transform: uppercase; color: var(--taupe); }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- Écrans ---------- */
.screen { min-height: 100%; padding: calc(var(--safe-top) + 28px) 24px calc(var(--safe-bottom) + 32px); max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.logo { display: block; width: 100%; max-width: 380px; margin: 0 auto; height: auto; }
.tagline { text-align: center; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--taupe); margin: -6px 0 6px; }
.hello { text-align: center; font-family: var(--serif); font-size: 22px; font-weight: 400; margin: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px; padding: 12px 18px; border-radius: 999px; font-size: 11px; font-weight: 300; letter-spacing: .2em; text-transform: uppercase; transition: opacity .15s, transform .15s; }
.btn:active { transform: scale(.985); opacity: .85; }
.btn-primary { background: var(--umber); color: var(--lace); }
.btn-outline { border: 1px solid var(--umber); color: var(--umber); }
.btn-soft { background: var(--surface); color: var(--umber); }
.btn-text { color: var(--taupe); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 10px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.field { width: 100%; padding: 15px 18px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface-2); outline: none; font-weight: 300; }
.field::placeholder { color: var(--faint); }
.field:focus { border-color: var(--umber); }
.code-field { text-align: center; font-family: var(--serif); font-size: 31px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase; padding: 12px; }
.label { display: block; margin-bottom: 8px; }
.error { color: var(--blush); font-size: 12px; text-align: center; font-weight: 300; }
.section-head { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.section-head .rule { flex: 1; }
.room-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
.room-row .mono { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--peach); font-family: var(--serif); font-size: 17px; color: var(--taupe); flex: none; }
.room-row .grow { flex: 1; min-width: 0; }
.room-row .name { display: block; font-family: var(--serif); font-size: 18px; font-weight: 400; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--taupe); }
.hint { border-style: dashed; border-color: var(--peach); background: transparent; font-size: 12px; color: var(--muted); }
.hint b, b, strong { color: inherit; font-weight: 400; }
.hint b { color: var(--umber); }
.link-btn { color: var(--taupe); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--peach); padding-bottom: 1px; }

/* ---------- Salon ---------- */
.room { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; background: var(--bg); }
.topbar { padding: calc(var(--safe-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 8px; }
.topbar .back { width: 40px; height: 40px; display: grid; place-items: center; color: var(--umber); }
.topbar .title { flex: 1; text-align: center; font-family: var(--serif); font-size: 19px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { width: 40px; display: flex; justify-content: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--peach); }
.live.on .dot { background: var(--blush); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.phase { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
.phase .sep { width: 18px; height: 1px; background: var(--peach); }
.timeline { padding: 10px 18px 12px; border-bottom: 1px solid var(--line); }
.tl-bar { position: relative; height: 2px; background: var(--line-strong); border-radius: 1px; }
.tl-bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blush); border-radius: 1px; transition: width 1s linear; }
.tl-bar > b { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 3px rgba(195,131,128,.25); }
.timeline.tl-live .tl-bar > b { animation: pulse 2s infinite; }
.tl-labels { display: flex; justify-content: space-between; align-items: baseline; margin-top: 7px; font-size: 10.5px; color: var(--muted); letter-spacing: .06em; }
.tl-labels .now { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--umber); letter-spacing: 0; }
.photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; border: 1px solid var(--peach); background: var(--surface-2); }
.cand.elim .photo { opacity: .4; filter: grayscale(.6); }
.cand.crowned .photo { border: 2px solid var(--umber); }
.rank .photo { width: 36px; height: 36px; }
.sheet-photo { display: block; width: 132px; height: 176px; object-fit: cover; border-radius: 70px 70px 14px 14px; margin: 2px auto 12px; border: 1px solid var(--peach); }
.podium { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.podium:first-of-type { border-top: 0; }
.podium .place { width: 92px; flex: none; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); }
.podium.first .place { color: var(--blush); }
.podium .grow { flex: 1; min-width: 0; }
.podium .grow .name { display: block; font-family: var(--serif); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium.first .grow .name { font-size: 22px; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-list span { padding: 5px 11px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; color: var(--taupe); }
.winner-card { text-align: center; padding: 28px 20px 24px; }
.winner-card .yr { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--taupe); }
.winner-card .wname { font-family: var(--serif); font-size: 32px; line-height: 1.1; margin: 10px 0 6px; }
.winner-card .wreg { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--blush); }
.winner-card .wdate { font-size: 13px; color: var(--muted); margin-top: 14px; }
.year-chips .chip { font-family: var(--serif); font-size: 16px; letter-spacing: 0; text-transform: none; padding: 6px 14px; }
.tally { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tally .grow { flex: 1; }
.tally .bar { margin-top: 6px; }
.phase .sync { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; }
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 24px; }
.tabbar { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: var(--safe-bottom); }
.tabbar button { flex: 1; min-width: 0; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); position: relative; }
.tabbar button.active { color: var(--umber); }
.tabbar .badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 400; letter-spacing: 0; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.4); } }
.msg-banner { position: fixed; left: 12px; right: 12px; top: calc(var(--safe-top) + 10px); max-width: 560px; margin: 0 auto; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(75,52,44,.18); text-align: left; animation: drop .25s ease-out; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
.msg-banner .rdot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }
.msg-banner .grow { flex: 1; min-width: 0; }
.msg-banner .who { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--taupe); }
.msg-banner .txt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.progress { height: 2px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--blush); transition: width .4s; }
.search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-strong); padding: 0 2px; color: var(--muted); }
.search input { flex: 1; background: none; border: 0; outline: none; padding: 10px 0; font-weight: 300; }
.search input::placeholder { color: var(--faint); }
.toggle { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--taupe); white-space: nowrap; }
.toggle.on { background: var(--umber); border-color: var(--umber); color: var(--lace); }

.cand { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; transition: background .15s; }
.cand:active { background: var(--surface-2); }
.num { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 15px; font-weight: 400; color: var(--taupe); border: 1px solid var(--peach); flex: none; }
.cand.crowned .num, .num.crowned { background: var(--umber); border-color: var(--umber); color: var(--lace); }
.cand .info { flex: 1; min-width: 0; }
.cand .info .name { display: block; font-family: var(--serif); font-size: 17px; font-weight: 400; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .info .sub { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand.elim .info, .cand.elim .score, .cand.elim .num { opacity: .4; }
.cand.elim .info .name { text-decoration: line-through; text-decoration-thickness: 1px; }
.crit-dots { display: flex; gap: 5px; margin-top: 6px; }
.crit-dots i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--peach); }
.crit-dots i.on { background: var(--blush); border-color: var(--blush); }
.cand .score { text-align: right; flex: none; }
.big { font-family: var(--serif); font-size: 22px; font-weight: 400; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.todo { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--blush); }
.tag { display: inline-block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--blush); }

.seg { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
.seg button { flex: 1; padding: 9px; border-radius: 999px; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.seg button.active { background: var(--umber); color: var(--lace); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--taupe); }
.chip.active { background: var(--blush); border-color: var(--blush); color: #fff; }
.awards-title { font-family: var(--serif); font-style: italic; font-size: 21px; text-align: center; margin: 0 0 6px; }
.award { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.award .grow { flex: 1; min-width: 0; }
.award .grow .name { display: block; font-family: var(--serif); font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.award .val { font-family: var(--serif); font-size: 19px; color: var(--taupe); }
.rank { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; width: 100%; text-align: left; }
.rank .pos { width: 34px; text-align: center; font-family: var(--serif); font-size: 19px; color: var(--faint); flex: none; }
.rank.top .pos { color: var(--blush); font-style: italic; font-size: 24px; }
.rank.top { border-color: var(--peach); }
.rank:first-child.top { background: var(--surface-2); }
.rank .grow { flex: 1; min-width: 0; }
.rank .grow .name { display: block; font-family: var(--serif); font-size: 17px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank.elim { opacity: .5; }
.rank.elim .grow .name { text-decoration: line-through; text-decoration-thickness: 1px; }
.bar { height: 2px; background: var(--line); margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--peach); }
.rank.top .bar > i { background: var(--blush); }
.rank .val { text-align: right; flex: none; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .t { font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--umber); margin-bottom: 6px; }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 80%; align-self: flex-start; }
.msg.me { align-self: flex-end; text-align: right; }
.msg .who { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--taupe); margin: 0 0 3px 6px; }
.msg .txt { display: inline-block; padding: 9px 14px; border-radius: 18px 18px 18px 4px; background: var(--surface); border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; text-align: left; font-weight: 300; }
.msg.me .txt { background: var(--umber); border-color: var(--umber); color: var(--lace); border-radius: 18px 18px 4px 18px; }
.msg.emoji .txt { background: none !important; border: 0; font-size: 31px; padding: 0 2px; line-height: 1.15; }
.msg .time { font-size: 10px; color: var(--faint); margin: 3px 6px 0; }
.msg.pending { opacity: .5; }
.chatbar { padding: 8px 12px 10px; border-top: 1px solid var(--line); background: var(--bg); }
.reacts { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.reacts::-webkit-scrollbar { display: none; }
.reacts button { flex: none; font-size: 17px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); }
.compose { display: flex; gap: 8px; align-items: center; }
.compose input { flex: 1; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); outline: none; font-weight: 300; }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--umber); color: var(--lace); display: grid; place-items: center; flex: none; }

/* Salon */
.invite { text-align: center; padding: 26px 18px 20px; }
.invite .code { font-family: var(--serif); font-size: 41px; font-weight: 400; letter-spacing: .28em; margin: 6px 0 18px 0.28em; user-select: all; -webkit-user-select: all; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--peach); color: var(--umber); display: grid; place-items: center; font-family: var(--serif); font-size: 16px; font-weight: 400; flex: none; }
.avatar.host { background: var(--umber); color: var(--lace); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 300; }
.setting select { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 12px; max-width: 58%; font-size: 12px; }
.danger { color: var(--blush); }

/* Feuille de notation */
.sheet-bg { position: fixed; inset: 0; background: rgba(75,52,44,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet { overflow-x: hidden; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 10px 18px calc(var(--safe-bottom) + 20px); animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 10px; }
.sheet-title { font-family: var(--serif); font-size: 28px; font-weight: 400; text-align: center; margin: 4px 0; }
.sheet-head { text-align: center; padding: 6px 0 16px; }
.sheet-head .num { margin: 0 auto 8px; }
.sheet-head h2 { font-family: var(--serif); font-size: 29px; font-weight: 400; margin: 0; line-height: 1.1; }
.sheet-head .overall { margin-top: 10px; font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--taupe); }
.sheet-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sheet-nav button { color: var(--taupe); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; padding: 8px 2px; display: flex; align-items: center; gap: 4px; }
.sheet-nav button.ok { color: var(--umber); }
.sheet-nav button[disabled] { opacity: .25; }
.crit-card { padding: 16px 0; border-top: 1px solid var(--line); }
.crit-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.crit-head .name { font-family: var(--serif); font-size: 19px; font-weight: 400; }
.scores { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.scores button { border-radius: 50%; aspect-ratio: 1; max-width: 42px; justify-self: center; width: 100%; min-width: 0; border: 1px solid var(--line-strong); font-family: var(--serif); font-size: 15px; font-weight: 400; color: var(--taupe); }
.scores button.on { background: var(--peach); border-color: var(--peach); color: var(--umber); }
.scores button.sel { background: var(--blush); border-color: var(--blush); color: #fff; }
.host-box { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 90px); transform: translateX(-50%); background: var(--umber); color: var(--lace); padding: 11px 20px; border-radius: 999px; font-size: 12px; font-weight: 300; z-index: 40; max-width: 90%; text-align: center; }
.spinner { width: 30px; height: 30px; border: 1px solid var(--line-strong); border-top-color: var(--umber); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* ================== Configuration ================== */
const params = new URLSearchParams(location.search);
// Serveur de synchronisation (ntfy.sh, gratuit et sans compte). Modifiable avec ?server=...
const NTFY = (params.get('server') || 'https://ntfy.sh').replace(/\/+$/, '');
const TOPIC_PREFIX = 'missparty27-';
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_LEN = 6;

const CRITERIA = [
  { k: 'tenue',      t: 'Tenue',      e: '👗', a: 'Meilleure tenue' },
  { k: 'maquillage', t: 'Maquillage', e: '💄', a: 'Meilleur maquillage' },
  { k: 'danse',      t: 'Danse',      e: '💃', a: 'Meilleure danse' },
  { k: 'discours',   t: 'Discours',   e: '🎤', a: 'Meilleur discours' },
];
const PHASES = [
  { k: 'avant',   t: 'Avant le show',        e: '🍿' },
  { k: 'defiles', t: 'Défilés des 30 Miss',  e: '✨' },
  { k: 'top15',   t: 'Top 15',               e: '🔥' },
  { k: 'top5',    t: 'Top 5',                e: '😱' },
  { k: 'couronnement', t: 'Couronnement',   e: '👑' },
  { k: 'fini',    t: "C'est fini !",         e: '🎉' },
];
const REGIONS = [
  'Alsace', 'Aquitaine', 'Auvergne', 'Bourgogne', 'Bretagne',
  'Centre-Val de Loire', 'Champagne-Ardenne', 'Corse', "Côte d'Azur", 'Franche-Comté',
  'Guadeloupe', 'Guyane', 'Île-de-France', 'Languedoc', 'Limousin',
  'Lorraine', 'Martinique', 'Mayotte', 'Nord-Pas-de-Calais', 'Normandie',
  'Nouvelle-Calédonie', 'Pays de la Loire', 'Picardie', 'Poitou-Charentes', 'Provence',
  'Réunion', 'Rhône-Alpes', 'Roussillon', 'Saint-Martin & Saint-Barthélemy', 'Tahiti',
];
const REACTIONS = ['😍', '👑', '🔥', '😱', '👏', '😂', '💅', '😭', '🤩', '👀'];
const NC = REGIONS.length, NK = CRITERIA.length;
/* Palmarès Miss France (année du titre, élection en décembre de l'année précédente).
   Les régions sont rattachées aux noms actuels de la liste REGIONS. */
const PAST_WINNERS = [
  { y: 2026, name: 'Hinaupoko Devèze',          region: 'Tahiti',             date: '6 décembre 2025' },
  { y: 2025, name: 'Angélique Angarni-Filopon', region: 'Martinique',         date: '14 décembre 2024' },
  { y: 2024, name: 'Ève Gilles',                region: 'Nord-Pas-de-Calais', date: '16 décembre 2023' },
  { y: 2023, name: 'Indira Ampiot',             region: 'Guadeloupe',         date: '17 décembre 2022' },
  { y: 2022, name: 'Diane Leyre',               region: 'Île-de-France',      date: '11 décembre 2021' },
  { y: 2021, name: 'Amandine Petit',            region: 'Normandie',          date: '19 décembre 2020' },
  { y: 2020, name: 'Clémence Botino',           region: 'Guadeloupe',         date: '14 décembre 2019' },
  { y: 2019, name: 'Vaimalama Chaves',          region: 'Tahiti',             date: '15 décembre 2018' },
  { y: 2018, name: 'Maëva Coucke',              region: 'Nord-Pas-de-Calais', date: '16 décembre 2017' },
  { y: 2017, name: 'Alicia Aylies',             region: 'Guyane',             date: '17 décembre 2016' },
  { y: 2016, name: 'Iris Mittenaere',           region: 'Nord-Pas-de-Calais', date: '19 décembre 2015', note: 'Élue ensuite Miss Univers 2016' },
  { y: 2015, name: 'Camille Cerf',              region: 'Nord-Pas-de-Calais', date: '6 décembre 2014' },
  { y: 2014, name: 'Flora Coquerel',            region: 'Centre-Val de Loire', date: '7 décembre 2013', note: 'Élue sous l\'écharpe de Miss Orléanais' },
  { y: 2013, name: 'Marine Lorphelin',          region: 'Bourgogne',          date: '8 décembre 2012' },
  { y: 2012, name: 'Delphine Wespiser',         region: 'Alsace',             date: '3 décembre 2011' },
  { y: 2011, name: 'Laury Thilleman',           region: 'Bretagne',           date: '4 décembre 2010' },
];
const PLACES = ['', 'Miss France 2027', '1re dauphine', '2e dauphine', '3e dauphine', '4e dauphine'];
const DEFAULT_START = [21, 10];   // heure de début habituelle de l'émission (21 h 10)
const DEFAULT_DURATION = 200;     // durée habituelle : environ 3 h 20
const EMPTY_VOTES = '0'.repeat(NC * NK);

/* ================== Utilitaires ================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clampStr = (s, n) => (typeof s === 'string' ? s.trim().slice(0, n) : '');
const fmt = x => x.toFixed(1).replace('.', ',');
const randFrom = (alpha, n) => { const a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a, x => alpha[x % alpha.length]).join(''); };
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, CODE_LEN);
const isValidCode = c => c.length === CODE_LEN && [...c].every(ch => CODE_ALPHABET.includes(ch));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const encScore = n => (n >= 10 ? 'a' : String(n));
const decScore = ch => (ch === 'a' ? 10 : (ch >= '1' && ch <= '9' ? +ch : 0));
const normVotes = v => (typeof v === 'string' && /^[0-9a]*$/.test(v)) ? (v + EMPTY_VOTES).slice(0, NC * NK) : EMPTY_VOTES;
const phaseOf = k => PHASES.find(p => p.k === k) || PHASES[0];
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function haptic() { try { navigator.vibrate && navigator.vibrate(8); } catch {} }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}

/* ================== Identité locale ================== */
let uid = store.get('mp_uid', null);
if (!uid) { uid = randFrom('abcdefghijklmnopqrstuvwxyz0123456789', 14); store.set('mp_uid', uid); }
let pseudo = store.get('mp_pseudo', '');
let myRooms = store.get('mp_rooms', []); // [{code, name, t}]
function rememberRoom(code, name) {
  myRooms = myRooms.filter(r => r.code !== code);
  myRooms.unshift({ code, name: name || 'Salon', t: Date.now() });
  myRooms = myRooms.slice(0, 20);
  store.set('mp_rooms', myRooms);
}
function forgetRoom(code) {
  myRooms = myRooms.filter(r => r.code !== code);
  store.set('mp_rooms', myRooms);
  try { localStorage.removeItem('mp_local_' + code); } catch {}
}

/* ================== Synchronisation (ntfy.sh) ==================
   Chaque salon = un "topic" ntfy. Chaque action publie un petit message JSON :
   - {k:'room'} : état du salon (nom, étape, noms des candidates, éliminées, gagnante) — publié par l'organisatrice
   - {k:'user'} : pseudo + toutes les notes d'une participante (une seule chaîne compacte)
   - {k:'chat'} : un message du chat
   Le dernier état (numéro de séquence s le plus grand) de chaque personne fait foi. */
class RoomSession {
  constructor(code) {
    this.code = code;
    this.topic = TOPIC_PREFIX + code;
    this.seen = new Set();
    this.lastId = null;
    this.meta = null;
    this.users = {};
    this.chat = [];
    this.es = null;
    this.live = false;
    this.lastEvent = 0;
    this.pendingMeta = false;
    this.pendingUser = false;
    this.chatQueue = [];
    this.photos = {};          // n° candidate -> image (data URL)
    this.photoParts = {};      // morceaux de photo en cours de réception
    this.photoQueue = [];      // morceaux à envoyer (organisatrice)
    this.localPhotos = store.get('mp_photos_' + code, {});
    this.timer = null;
    this.flushing = false;
    this.syncError = false;
    this.myLastTime = 0;
    this.metaLastTime = 0;
    this.onchange = () => {};
    this.local = Object.assign({ seq: 0, votes: EMPTY_VOTES, metaSeq: 0 }, store.get('mp_local_' + code, {}));
    this.local.votes = normVotes(this.local.votes);
    if (this.local.seq > 0) this.users[uid] = { n: pseudo, v: this.local.votes, s: this.local.seq, t: 0 };
  }

  save() { store.set('mp_local_' + this.code, this.local); }
  get isHost() { return !!this.meta && this.meta.h === uid; }

  async loadHistory() {
    const r = await fetch(`${NTFY}/${this.topic}/json?poll=1&since=all`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    for (const line of text.split('\n')) {
      if (!line.trim()) continue;
      try { this.handle(JSON.parse(line)); } catch {}
    }
    this.save();
  }

  handle(ev) {
    if (!ev || ev.event !== 'message' || !ev.id || this.seen.has(ev.id)) return false;
    this.seen.add(ev.id);
    this.lastId = ev.id;
    let d;
    try { d = JSON.parse(ev.message); } catch { return false; }
    if (!d || typeof d !== 'object' || typeof d.u !== 'string') return false;
    const t = ev.time || 0;
    const s = Number.isFinite(d.s) ? d.s : 0;

    if (d.k === 'room') {
      const host = this.meta ? this.meta.h : d.u;
      if (d.u !== host) return false;           // seule l'organisatrice peut modifier le salon
      if (d.u === uid) {
        this.metaLastTime = Math.max(this.metaLastTime, t);
        if (s <= this.local.metaSeq && this.meta) return true; // modification locale plus récente
        this.local.metaSeq = Math.max(this.local.metaSeq, s);
      }
      if (this.meta && s < this.meta.s) return true;
      const names = {};
      if (d.c && typeof d.c === 'object') for (const [k, v] of Object.entries(d.c)) { const n = +k; if (n >= 1 && n <= NC) { const nm = clampStr(v, 40); if (nm) names[n] = nm; } }
      this.meta = {
        h: host, s,
        name: clampStr(d.n, 60) || 'Soirée Miss France 2027',
        phase: phaseOf(d.p).k,
        names,
        elim: Array.isArray(d.e) ? d.e.filter(n => Number.isInteger(n) && n >= 1 && n <= NC) : [],
        crown: Number.isInteger(d.w) && d.w >= 1 && d.w <= NC ? d.w : null,
        pl: (() => { const o = {}; if (d.pl && typeof d.pl === 'object') for (const [k, v] of Object.entries(d.pl)) { const n = +k; if (n >= 1 && n <= NC && Number.isInteger(v) && v >= 1 && v <= 5) o[n] = v; } return o; })(),
        st: Number.isFinite(d.st) && d.st > 0 ? d.st : null,
        du: Number.isInteger(d.du) && d.du >= 30 && d.du <= 480 ? d.du : DEFAULT_DURATION,
      };
      return true;
    }
    if (d.k === 'user') {
      if (d.u === uid) {
        this.myLastTime = Math.max(this.myLastTime, t);
        if (s <= this.local.seq) return true;    // nos notes locales sont plus récentes
        this.local.seq = s;
        this.local.votes = normVotes(d.v);       // reprise des notes (ex. autre appareil)
      }
      const cur = this.users[d.u];
      if (cur && s < cur.s) return true;
      this.users[d.u] = { n: clampStr(d.n, 30) || 'Copine', v: normVotes(d.v), s, t };
      return true;
    }
    if (d.k === 'ph') {
      if (!this.meta || d.u !== this.meta.h) return false;    // photos : organisatrice uniquement
      const n = d.n;
      if (!Number.isInteger(n) || n < 1 || n > NC || typeof d.id !== 'string') return false;
      if (d.c === 0) { delete this.photos[n]; return true; }
      if (!Number.isInteger(d.c) || d.c < 1 || d.c > 12 || !Number.isInteger(d.i) || typeof d.d !== 'string') return false;
      const key = n + ':' + d.id;
      const part = this.photoParts[key] || (this.photoParts[key] = { n, c: d.c, parts: [] });
      part.parts[d.i] = d.d;
      if (part.parts.filter(x => typeof x === 'string').length === part.c) {
        const data = part.parts.join('');
        if (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)) this.photos[n] = data;
        delete this.photoParts[key];
      }
      return true;
    }
    if (d.k === 'chat') {
      const x = clampStr(d.x, 500);
      if (!x) return false;
      this.chat.push({ id: ev.id, u: d.u, n: clampStr(d.n, 30) || 'Copine', x, t });
      if (this.chat.length > 400) this.chat.splice(0, this.chat.length - 400);
      if (d.u === uid) this.chatQueue = this.chatQueue.filter(m => m.cid !== d.cid);
      return true;
    }
    return false;
  }

  connect() {
    this.disconnect();
    const since = this.lastId || 'all';
    let es;
    try { es = new EventSource(`${NTFY}/${this.topic}/sse?since=${encodeURIComponent(since)}`); }
    catch { this.scheduleReconnect(); return; }
    this.es = es;
    const alive = () => { this.lastEvent = Date.now(); if (!this.live) { this.live = true; this.onchange(); } };
    es.onopen = alive;
    es.addEventListener('open', alive);
    es.addEventListener('keepalive', alive);
    es.onmessage = e => {
      alive();
      try { if (this.handle(JSON.parse(e.data))) { this.save(); this.onchange(); } } catch {}
    };
    es.onerror = () => {
      if (this.es !== es) return;
      es.close();
      this.es = null;
      this.live = false;
      this.onchange();
      this.scheduleReconnect();
    };
    if (!this.watchdog) {
      this.watchdog = setInterval(() => {
        if (document.visibilityState !== 'visible') return;
        if (!this.es || Date.now() - this.lastEvent > 80000) this.connect();
      }, 15000);
    }
    this.lastEvent = Date.now();
  }
  scheduleReconnect() {
    clearTimeout(this.reconnectTimer);
    this.reconnectTimer = setTimeout(() => this.connect(), 4000);
  }
  disconnect() {
    clearTimeout(this.reconnectTimer);
    if (this.es) { const es = this.es; this.es = null; es.close(); }
    this.live = false;
  }
  close() {
    this.flush();
    this.disconnect();
    clearInterval(this.watchdog);
    this.watchdog = null;
    this.onchange = () => {};
  }

  async post(obj) {
    const body = JSON.stringify(obj);
    const r = await fetch(`${NTFY}/${this.topic}`, { method: 'POST', body, keepalive: true });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }
  metaPayload() {
    const m = this.meta;
    return { k: 'room', u: uid, s: m.s, n: m.name, p: m.phase, c: m.names, e: m.elim, w: m.crown, st: m.st, du: m.du, pl: m.pl };
  }
  userPayload() {
    return { k: 'user', u: uid, s: this.local.seq, n: pseudo, v: this.local.votes };
  }
  schedule(delay) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), delay);
  }
  get hasPending() { return this.pendingMeta || this.pendingUser || this.chatQueue.length > 0 || this.photoQueue.length > 0; }

  async flush() {
    clearTimeout(this.timer);
    this.timer = null;
    if (this.flushing || !this.hasPending) return;
    this.flushing = true;
    try {
      if (this.pendingMeta && this.isHost) {
        this.pendingMeta = false;
        try { await this.post(this.metaPayload()); } catch (e) { this.pendingMeta = true; throw e; }
      }
      if (this.pendingUser) {
        this.pendingUser = false;
        try { await this.post(this.userPayload()); } catch (e) { this.pendingUser = true; throw e; }
      }
      while (this.chatQueue.length) {
        const m = this.chatQueue[0];
        if (!m.sent) { await this.post({ k: 'chat', u: uid, n: pseudo, x: m.x, cid: m.cid }); m.sent = true; }
        if (this.chatQueue[0] === m) this.chatQueue.shift();
      }
      while (this.photoQueue.length && this.isHost) {
        await this.post(this.photoQueue[0]);
        this.photoQueue.shift();
      }
      this.syncError = false;
    } catch {
      this.syncError = true;
      this.schedule(15000); // le serveur limite le débit : on réessaie un peu plus tard
    } finally {
      this.flushing = false;
      this.onchange();
    }
  }

  /* ---- Actions ---- */
  setScore(ci, ki, value) {
    const i = ci * NK + ki;
    const v = this.local.votes;
    this.local.votes = v.slice(0, i) + encScore(value) + v.slice(i + 1);
    this.touchUser();
    this.schedule(5000); // regroupe plusieurs notes dans un seul envoi
  }
  touchUser() {
    this.local.seq += 1;
    this.users[uid] = { n: pseudo, v: this.local.votes, s: this.local.seq, t: Date.now() / 1000 };
    this.pendingUser = true;
    this.save();
    this.onchange();
  }
  updateMeta(patch) {
    if (!this.isHost) return;
    this.local.metaSeq += 1;
    this.meta = Object.assign({}, this.meta, patch, { s: this.local.metaSeq });
    this.pendingMeta = true;
    this.save();
    this.onchange();
    this.schedule(1500);
  }
  sendChat(text) {
    const x = clampStr(text, 500);
    if (!x) return;
    this.chatQueue.push({ x, cid: randFrom('abcdefghijklmnopqrstuvwxyz0123456789', 8), t: Date.now() / 1000 });
    this.onchange();
    this.flush();
  }

  /* ---- Calculs ---- */
  score(u, ci, ki) { const usr = this.users[u]; return usr ? decScore(usr.v[ci * NK + ki]) : 0; }
  average(ci, ki, onlyUid) {
    let sum = 0, n = 0;
    for (const u of Object.keys(this.users)) {
      if (onlyUid && u !== onlyUid) continue;
      const x = this.score(u, ci, ki);
      if (x) { sum += x; n++; }
    }
    return n ? { v: sum / n, n } : null;
  }
  overall(ci, onlyUid) {
    const parts = CRITERIA.map((_, k) => this.average(ci, k, onlyUid)).filter(Boolean);
    if (!parts.length) return null;
    let voters = 0;
    for (const u of Object.keys(this.users)) {
      if (onlyUid && u !== onlyUid) continue;
      if (CRITERIA.some((_, k) => this.score(u, ci, k))) voters++;
    }
    return { v: parts.reduce((a, p) => a + p.v, 0) / parts.length, n: voters };
  }
  ranking(ki, onlyUid) {
    const out = [];
    for (let ci = 0; ci < NC; ci++) {
      const r = ki < 0 ? this.overall(ci, onlyUid) : this.average(ci, ki, onlyUid);
      if (r) out.push({ ci, v: r.v, n: r.n });
    }
    return out.sort((a, b) => b.v - a.v || a.ci - b.ci);
  }
  ratedCount(u) {
    let c = 0;
    for (let ci = 0; ci < NC; ci++) if (CRITERIA.some((_, k) => this.score(u, ci, k))) c++;
    return c;
  }
  setPhoto(n, dataUrl) {
    if (!this.isHost) return;
    const id = randFrom('abcdefghijklmnopqrstuvwxyz0123456789', 6);
    this.photoQueue = this.photoQueue.filter(m => m.n !== n);
    if (dataUrl) {
      this.photos[n] = dataUrl;
      this.localPhotos[n] = dataUrl;
      this.queuePhoto(n, dataUrl, id);
    } else {
      delete this.photos[n];
      delete this.localPhotos[n];
      this.photoQueue.push({ k: 'ph', u: uid, n, id, c: 0 });
    }
    store.set('mp_photos_' + this.code, this.localPhotos);
    this.onchange();
    this.flush();
  }
  queuePhoto(n, dataUrl, id) {
    const size = 3500, c = Math.ceil(dataUrl.length / size);
    for (let i = 0; i < c; i++) this.photoQueue.push({ k: 'ph', u: uid, n, id, i, c, d: dataUrl.slice(i * size, (i + 1) * size) });
  }
  republishPhotos() {
    for (const [n, data] of Object.entries(this.localPhotos)) {
      this.queuePhoto(+n, data, randFrom('abcdefghijklmnopqrstuvwxyz0123456789', 6));
      if (!this.photos[n]) this.photos[n] = data;
    }
  }
  setPlace(n, place) {
    const pl = Object.assign({}, this.meta.pl || {});
    for (const k of Object.keys(pl)) if (+k === n || (place && pl[k] === place)) delete pl[k];
    if (place) pl[n] = place;
    let crown = this.meta.crown;
    if (place === 1) crown = n; else if (crown === n) crown = null;
    const elim = place ? this.meta.elim.filter(x => x !== n) : this.meta.elim;
    this.updateMeta({ pl, crown, elim });
  }
  startTime() {
    if (this.meta && this.meta.st) return this.meta.st * 1000;
    const d = new Date(); d.setHours(DEFAULT_START[0], DEFAULT_START[1], 0, 0);
    return d.getTime();
  }
  candidate(ci) {
    const n = ci + 1, m = this.meta || { names: {}, elim: [], crown: null, pl: {} };
    return { ci, n, title: 'Miss ' + REGIONS[ci], name: m.names[n] || '', elim: m.elim.includes(n), crown: m.crown === n, photo: this.photos[n] || null, place: (m.pl && m.pl[n]) || (m.crown === n ? 1 : 0) };
  }
}

let session = null;
const ui = { tab: 'cand', search: '', hideElim: false, rankScope: 'group', rankCrit: -1, sheetCi: null, chatSeen: 0, chatNotified: 0 };

function go(view, arg) {
  clearInterval(timelineTimer); timelineTimer = null;
  hideMsgBanner();
  if (session && view !== 'room') { session.close(); session = null; }
  closeSheet();
  if (view === 'home') renderHome();
  else if (view === 'pseudo') renderPseudo(arg);
  else if (view === 'room') openRoom(arg);
}

}

function sheetShell(inner) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog"><div class="grabber"></div>${inner}</div></div>`;
  const bg = root.firstElementChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  return bg.firstElementChild;
}
function closeSheet() { $('#sheet-root').innerHTML = ''; ui.sheetCi = null; }

function openCreateSheet() {
  const sh = sheetShell(`
    <div class="stack" style="padding:6px 4px 10px;gap:14px">
      <h2 class="sheet-title">Nouveau salon</h2>
      <p class="center muted small" style="margin:-6px 0 4px">Choisis un nom, puis partage le code à tes copines.</p>

      <button id="ok" class="btn btn-primary">Créer le salon</button>
      <button id="cancel" class="btn-text">Annuler</button>
    </div>`);
  $('#cancel', sh).onclick = closeSheet;
  $('#ok', sh).onclick = async () => {
    const btn = $('#ok', sh);
    btn.disabled = true; btn.textContent = 'Création…';
    try {
      const code = await createRoom(clampStr($('#room-name', sh).value, 60) || 'Soirée Miss France 2027');
      closeSheet();
      go('room', { code, fresh: true });
    } catch (e) {
      $('#err', sh).textContent = 'Impossible de créer le salon. Vérifie ta connexion internet et réessaie.';
      btn.disabled = false; btn.textContent = 'Créer le salon';
    }
  };
}

async function createRoom(name) {
  for (let attempt = 0; attempt < 5; attempt++) {
    const code = randFrom(CODE_ALPHABET, CODE_LEN);
    const s = new RoomSession(code);
    await s.loadHistory();
    if (s.seen.size) continue; // code déjà utilisé
    s.local = { seq: 1, votes: EMPTY_VOTES, metaSeq: 1 };
    s.meta = { h: uid, s: 1, name, phase: 'avant', names: {}, elim: [], crown: null, st: null, du: DEFAULT_DURATION, pl: {} };
    await s.post(s.metaPayload());
    await s.post(s.userPayload());
    s.save();
    rememberRoom(code, name);
    return code;
  }
  throw new Error('no code');
}

      <button id="ok" class="btn btn-primary">Rejoindre</button>
      <button id="cancel" class="btn-text">Annuler</button>
    </div>`);

  const upd = () => { const c = normCode(input.value); if (input.value !== c) input.value = c; btn.disabled = !isValidCode(c); };

  $('#cancel', sh).onclick = closeSheet;

  btn.onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 80);
}

/* ---------- Salon ---------- */
async function openRoom({ code, joining }) {
  $('#app').innerHTML = `<div class="screen"><div style="flex:1"></div>${LOGO}<div class="spinner"></div><p class="center eyebrow">Connexion au salon ${esc(code)}</p><div style="flex:1.4"></div></div>`;
  const s = new RoomSession(code);
  try {
    await s.loadHistory();
  } catch {
    $('#app').innerHTML = errorScreen('Pas de connexion', 'Impossible de joindre le salon. Vérifie ta connexion internet.', code);
    bindErrorScreen(code);
    return;
  }
  if (!s.meta) {
    $('#app').innerHTML = errorScreen('Salon introuvable',
      "Aucun salon ne correspond à ce code. Vérifie-le avec ta copine.<br><br><span class='small'>Les salons sont conservés 12&nbsp;h après leur dernière activité : crée-le le soir de l'élection.</span>", code);
    bindErrorScreen(code);
    return;
  }
  session = s;
  rememberRoom(code, s.meta.name);
  ui.tab = 'cand'; ui.search = ''; ui.sheetCi = null;
  { // messages déjà lus : retrouvés grâce au dernier message vu, gardé sur le téléphone
    const lastSeen = store.get('mp_seen_' + code, null);
    const i = lastSeen ? s.chat.findIndex(m => m.id === lastSeen) : -1;
    ui.chatSeen = lastSeen ? (i >= 0 ? i + 1 : s.chat.length) : s.chat.length;
    ui.chatNotified = s.chat.length;
  }

  // Rejoindre / rafraîchir sa présence (les messages expirent au bout de 12 h sur ntfy.sh)
  const now = Date.now() / 1000;
  if (s.local.seq === 0 || !s.users[uid]) { s.local.seq += 1; s.users[uid] = { n: pseudo, v: s.local.votes, s: s.local.seq, t: now }; s.pendingUser = true; }
  else if (s.users[uid].n !== pseudo || now - s.myLastTime > 6 * 3600) { s.touchUser(); }
  if (s.isHost && now - s.metaLastTime > 6 * 3600) { s.pendingMeta = true; s.republishPhotos(); }
  if (s.isHost) for (const [n, d] of Object.entries(s.localPhotos)) if (!s.photos[n]) s.photos[n] = d;
  s.save();
  s.flush();

  buildRoomShell();
  s.onchange = scheduleRender;
  s.connect();
  renderRoom();
  timelineTimer = setInterval(renderTimeline, 20000);
  if (joining) toast(`Bienvenue dans « ${s.meta.name} »`);
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (session) renderRoom(); });
}

function renderRoom() {
  const s = session; if (!s || !$('#r-main')) return;
  const ph = phaseOf(s.meta.phase);
  $('#r-title').textContent = s.meta.name;
  $('#r-live').className = 'live ' + (s.live ? 'on' : 'off');
  $('#r-live').title = s.live ? 'En direct' : 'Connexion…';
  const syncTxt = s.syncError ? 'envoi en attente' : (s.hasPending ? 'envoi…' : (s.live ? 'en direct' : 'connexion…'));
  renderTimeline();
  $('#r-phase').innerHTML = `<span class="eyebrow">${esc(ph.t)}</span><span class="sep"></span><span class="sync">${syncTxt}</span>`;
  for (const t of ['cand', 'rank', 'chat', 'hist', 'room']) {
    $('#tab-' + t).classList.toggle('hidden', ui.tab !== t);
    $(`#tabbar [data-tab="${t}"]`).classList.toggle('active', ui.tab === t);
  }
  $('#chatbar').classList.toggle('hidden', ui.tab !== 'chat');
  if (ui.tab === 'chat' && ui.chatSeen !== s.chat.length) {
    ui.chatSeen = s.chat.length;
    if (s.chat.length) store.set('mp_seen_' + s.code, s.chat[s.chat.length - 1].id);
    hideMsgBanner();
  }
  const unread = s.chat.slice(ui.chatSeen).filter(m => m.u !== uid).length;
  const badge = $('#chat-badge');
  badge.classList.toggle('hidden', unread === 0);
  badge.textContent = unread > 99 ? '99+' : String(unread);
  // petite bannière en haut quand une copine écrit pendant qu'on est sur un autre onglet
  if (s.chat.length > ui.chatNotified) {
    const fresh = s.chat.slice(ui.chatNotified).filter(m => m.u !== uid);
    ui.chatNotified = s.chat.length;
    if (fresh.length && ui.tab !== 'chat') showMsgBanner(fresh[fresh.length - 1]);
  }

  if (ui.tab === 'cand') renderCandidates();
  else if (ui.tab === 'rank') renderRanking();
  else if (ui.tab === 'chat') renderChat();
  else if (ui.tab === 'hist') renderPalmares($('#tab-hist'));
  else renderRoomInfo();
  if (ui.sheetCi !== null) renderRatingBody();
}

let bannerTimer;
function showMsgBanner(m) {
  hideMsgBanner();
  const b = document.createElement('button');
  b.className = 'msg-banner';
  b.id = 'msg-banner';
  b.innerHTML = `<span class="rdot"></span><span class="grow"><span class="who">${esc(m.n)}</span><span class="txt">${esc(m.x)}</span></span>`;
  b.onclick = () => { hideMsgBanner(); closeSheet(); ui.tab = 'chat'; renderRoom(); scrollChatBottom(); };
  document.body.appendChild(b);
  try { navigator.vibrate && navigator.vibrate(15); } catch {}
  bannerTimer = setTimeout(hideMsgBanner, 4500);
}
function hideMsgBanner() { clearTimeout(bannerTimer); const b = $('#msg-banner'); if (b) b.remove(); }

const hhmm = ms => { const d = new Date(ms); return `${d.getHours()} h ${String(d.getMinutes()).padStart(2, '0')}`; };
const dur = min => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`; };
function renderTimeline() {
  const s = session, el = $('#r-timeline'); if (!s || !el) return;
  const start = s.startTime(), end = start + s.meta.du * 60000, now = Date.now();
  const pct = Math.min(100, Math.max(0, (now - start) / (end - start) * 100));
  let label;
  if (now < start) label = (start - now) < 36 * 3600000 ? `Début dans ${dur((start - now) / 60000)}` : `Le ${new Date(start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}`;
  else if (now < end) label = `En direct · ${dur((now - start) / 60000)}`;
  else label = 'Cérémonie terminée';
  el.className = 'timeline' + (now >= start && now < end ? ' tl-live' : '');
  el.innerHTML = `<div class="tl-bar"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
    <div class="tl-labels"><span>${hhmm(start)}</span><span class="now">${label}</span><span>${hhmm(end)}</span></div>`;
}
let timelineTimer = null;

function renderCandidates() {
  const s = session; if (!s) return;
  const rated = s.ratedCount(uid);
  $('#cand-progress').textContent = `${rated} / ${NC} notées`;
  $('#cand-bar').style.width = (rated / NC * 100) + '%';
  $('#hide-elim').classList.toggle('on', ui.hideElim);
  const norm = x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const q = norm(ui.search.trim());
  let html = '';
  for (let ci = 0; ci < NC; ci++) {
    const c = s.candidate(ci);
    if (ui.hideElim && c.elim) continue;
    if (q && !norm(c.title).includes(q) && !norm(c.name).includes(q)) continue;
    const mine = s.overall(ci, uid), group = s.overall(ci);
    const dots = CRITERIA.map((cr, k) => `<i class="${s.score(uid, ci, k) ? 'on' : ''}" title="${cr.t}"></i>`).join('');
    html += `
      <button class="cand ${c.elim ? 'elim' : ''} ${c.crown ? 'crowned' : ''}" data-ci="${ci}">

// Résultats officiels saisis par l'organisatrice + comparaison avec les pronostics du salon
function officialHtml(s) {
  const all = Array.from({ length: NC }, (_, ci) => s.candidate(ci));
  const placed = all.filter(c => c.place).sort((a, b) => a.place - b.place);
  const anyElim = all.some(c => c.elim);
  if (!placed.length && !anyElim) {
    return `<div class="empty"><div class="t">Résultats à venir</div>Le soir de l'élection, l'organisatrice saisit les résultats officiels au fur et à mesure de leur annonce : ils s'afficheront ici.</div>`;
  }
  const status = c => c.place ? PLACES[c.place] : c.elim ? 'Éliminée' : (anyElim ? 'Encore en lice' : 'En lice');
  const photo = c => c.photo ? `<img class="photo" src="${c.photo}" alt="">` : `<span class="num ${c.place === 1 ? 'crowned' : ''}">${c.n}</span>`;
  let html = '';
  if (placed.length) {
    html += `<div class="card"><h3 class="awards-title">Résultats officiels</h3>` + placed.map(c => `
      <button class="podium ${c.place === 1 ? 'first' : ''}" data-ci="${c.ci}">
        <span class="place">${c.place === 1 ? ICON.crown + ' ' : ''}${PLACES[c.place]}</span>
        ${photo(c)}
        <span class="grow"><span class="name">${esc(c.title)}</span>${c.name ? `<span class="small muted">${esc(c.name)}</span>` : ''}</span>
      </button>`).join('') + `</div>`;
  }
  const still = all.filter(c => !c.elim && !c.place);
  if (anyElim && still.length && still.length <= 15) {
    html += `<div class="card"><div class="eyebrow" style="margin-bottom:10px">Encore en lice · ${still.length}</div><div class="pill-list">${still.map(c => `<span>${esc(REGIONS[c.ci])}</span>`).join('')}</div></div>`;
  }
  // Qui avait vu juste ?
  const members = Object.entries(s.users);
  const official5 = placed.map(c => c.ci);
  const rows = members.map(([u, m]) => {
    const r = s.ranking(-1, u);
    if (!r.length) return null;
    const fav = s.candidate(r[0].ci);
    const top5 = r.slice(0, 5).map(x => x.ci);
    const hits = official5.filter(ci => top5.includes(ci)).length;
    const favScore = fav.place ? 10 - fav.place : fav.elim ? 0 : 1;
    return { u, n: m.n, fav, hits, sort: favScore * 10 + hits };
  }).filter(Boolean).sort((a, b) => b.sort - a.sort);
  if (rows.length) {
    html += `<div class="card"><h3 class="awards-title">Qui avait vu juste ?</h3>` + rows.map(r => `
      <div class="list-item">
        <span class="avatar ${r.fav.place === 1 ? 'host' : ''}">${esc((r.n[0] || '?').toUpperCase())}</span>
        <span style="flex:1;min-width:0">
          <span>${esc(r.n)}</span>${r.u === uid ? ' <span class="small muted">· moi</span>' : ''}
          <div class="small muted">Sa favorite : ${esc(r.fav.title)} · <span style="color:${r.fav.place ? 'var(--blush)' : 'inherit'}">${status(r.fav)}</span></div>
          ${placed.length ? `<div class="tiny muted">${r.hits} / ${placed.length} de son top 5 au palmarès</div>` : ''}
        </span>
      </div>`).join('') + `</div>`;
  }
  return html;
}

          <span class="grow"><span class="serif" style="font-size:17px">Miss ${esc(reg)}</span><div class="tiny muted">${years.join(' · ')}</div><div class="bar"><i style="width:${years.length / max * 100}%"></i></div></span>
          <span class="big" style="font-size:20px">${years.length}</span>

function regionHistory(region) {
  const ys = PAST_WINNERS.filter(x => x.region === region).map(x => x.y).sort((a, b) => a - b);
  if (!ys.length) return '';
  const last = PAST_WINNERS.find(x => x.y === ys[ys.length - 1]);
  return ys.length === 1 ? `Sa région a remporté la couronne en ${ys[0]} (${last.name})`
    : `Sa région a remporté la couronne ${ys.length} fois : ${ys.join(', ')}`;
}

/* ---------- Photos des candidates ---------- */
function pickPhoto(n) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file || !session) return;
    try {
      const data = await compressPhoto(file);
      session.setPhoto(n, data);
      toast('Photo ajoutée');
    } catch { toast("Impossible de lire cette image"); }
  };
  input.click();
}
// Recadre en portrait 3:4 et réduit l'image pour qu'elle passe vite par le salon.
function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const W = 150, H = 200, r = W / H;
      let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
      if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; }
      else { const nh = sw / r; sy = (sh - nh) * 0.2; sh = nh; }   // garde le haut de l'image (le visage)
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#E5DECE'; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      let q = 0.7, out = cv.toDataURL('image/jpeg', q);
      while (out.length > 14000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

/* ---------- Feuille de notation ---------- */
function openRating(ci) {
  ui.sheetCi = ci;
  const sh = sheetShell('<div id="rating"></div>');
  sh.addEventListener('click', e => {
    const s = session; if (!s) return;
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.score) {
      const [k, v] = b.dataset.score.split(':').map(Number);
      const cur = s.score(uid, ui.sheetCi, k);
      haptic();
      s.setScore(ui.sheetCi, k, cur === v ? 0 : v);
    } else if (b.id === 'prev' || b.id === 'next') {
      const n = ui.sheetCi + (b.id === 'prev' ? -1 : 1);
      if (n >= 0 && n < NC) { ui.sheetCi = n; renderRatingBody(); sh.scrollTop = 0; }
    } else if (b.id === 'done') {
      closeSheet(); s.flush(); renderRoom();
    } else if (b.id === 'set-photo') {
      pickPhoto(ui.sheetCi + 1);
    } else if (b.id === 'del-photo') {
      s.setPhoto(ui.sheetCi + 1, null);
    } else if (b.id === 'set-name') {
      const c = s.candidate(ui.sheetCi);
      const v = prompt(`Prénom et nom de ${c.title}`, c.name);
      if (v !== null) { const names = Object.assign({}, s.meta.names); const t = clampStr(v, 40); if (t) names[c.n] = t; else delete names[c.n]; s.updateMeta({ names }); }
    } else if (b.id === 'toggle-elim') {
      const c = s.candidate(ui.sheetCi);
      const elim = c.elim ? s.meta.elim.filter(n => n !== c.n) : s.meta.elim.concat(c.n);
      const pl = Object.assign({}, s.meta.pl || {}); if (!c.elim) delete pl[c.n];
      s.updateMeta({ elim, pl, crown: !c.elim && c.crown ? null : s.meta.crown });
    }
  });
  sh.addEventListener('change', e => {
    const s = session; if (!s || e.target.id !== 'placement') return;
    const c = s.candidate(ui.sheetCi), place = +e.target.value;
    s.setPlace(c.n, place);
    e.target.blur();
    if (place === 1) toast(`${c.title} est couronnée Miss France 2027`);
  });
  renderRatingBody();
}

}

window.addEventListener('pagehide', () => { if (session) session.flush(); });

(function start() {
  const code = normCode(params.get('code') || '');
  if (params.get('code')) {
    const u = new URL(location.href); u.searchParams.delete('code');
    try { history.replaceState(null, '', u.toString()); } catch {}
  }
  const next = () => {
    if (isValidCode(code) && myRooms.some(r => r.code === code)) go('room', { code });
    else { go('home'); if (isValidCode(code)) openJoinSheet(code); }
  };
  if (!pseudo) renderPseudo(next); else next();
})();
</script>
